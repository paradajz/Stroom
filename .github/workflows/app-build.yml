name: App Build

on:
  workflow_call:
    inputs:
      image_name:
        description: Devcontainer image name.
        required: true
        type: string
      image_tag:
        description: Devcontainer image tag.
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  app:
    name: App (${{ matrix.video_mode }})
    strategy:
      fail-fast: false
      matrix:
        video_mode: [480i, 480p]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container: &build-container
      image: ${{ inputs.image_name }}:${{ inputs.image_tag }}
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ github.token }}
      options: --user root
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      JOBS: 2
    defaults: &build-defaults
      run:
        shell: bash
    steps:
      - name: Pull the repository and dependencies
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Prepare Stroom
        uses: ./.github/actions/prepare-stroom
        with:
          image: ${{ inputs.image_name }}:${{ inputs.image_tag }}
          sdk: "true"
      - name: Build production package
        run: make prod VIDEO_MODE=${{ matrix.video_mode }}
      - name: Upload production archive
        uses: actions/upload-artifact@v7
        with:
          name: prod-${{ matrix.video_mode }}
          path: build/stroom/${{ matrix.video_mode }}/app/memcard/
          archive: true
          if-no-files-found: error
      - name: Build development package
        run: make dev VIDEO_MODE=${{ matrix.video_mode }}
      - name: Upload development archive
        uses: actions/upload-artifact@v7
        with:
          name: dev-${{ matrix.video_mode }}
          path: build/stroom/${{ matrix.video_mode }}/ps2link/memcard/
          archive: true
          if-no-files-found: error
  installer:
    name: Installer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: *build-container
    defaults: *build-defaults
    steps:
      - name: Pull the repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare Stroom
        uses: ./.github/actions/prepare-stroom
        with:
          image: ${{ inputs.image_name }}:${{ inputs.image_tag }}
      - name: Build installer package
        run: make installer
      - name: Upload installer archive
        uses: actions/upload-artifact@v7
        with:
          name: installer
          path: build/installer/
          archive: true
          if-no-files-found: error
