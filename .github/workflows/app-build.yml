name: App Build

on:
  workflow_call:
    inputs:
      image_name:
        description: Devcontainer image name.
        required: true
        type: string
      image_tag:
        description: Devcontainer image tag.
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  app:
    name: App
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ${{ inputs.image_name }}:${{ inputs.image_tag }}
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ github.token }}
      options: --user root
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      JOBS: 2
    defaults:
      run:
        shell: bash
    steps:
      - name: Pull the repository and dependencies
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Prepare Stroom
        uses: ./.github/actions/prepare-stroom
        with:
          image: ${{ inputs.image_name }}:${{ inputs.image_tag }}
          sdk: "true"
      - name: Build app
        run: make stroom
      - name: Build PS2Link launcher
        run: make ps2link
      - name: Upload app binaries
        uses: actions/upload-artifact@v7
        with:
          name: stroom
          path: build/stroom/stroom*.elf
          if-no-files-found: error
      - name: Upload PS2Link launcher
        uses: actions/upload-artifact@v7
        with:
          name: ps2link
          path: build/ps2link/release/PS2LINK.ELF
          if-no-files-found: error
